<!DOCTYPE html>
<html lang="en">

    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name=”description”
            content='Волгоград, ранее Сталинград, – город, расположенный в юго-западной части России на западном берегу реки Волги. Во время Второй мировой войны здесь проходила Сталинградская битва. В память об этом событии был возведен памятник-ансамбль "Героям Сталинградской битвы" с главным монументом – статуей "Родина-мать". '>
        <meta name="keywords" content='Волгоград, Мамаев Курган, Вечный Огонь'>
        <link rel="stylesheet" href="/css/style.css">
        <title>About</title>
    </head>

    <body>
        <header class="header">
            <div class="container">

                <nav class="nav">
                    <ul class="nav__list">
                        <li class="nav__item">
                            <a href="practice.html" class="nav__link">Назад</a>
                        </li>
                        <li class="nav__item">
                            <a href="practice.html#about" class="nav__link">О городе</a>
                        </li>
                        <li class="nav__item">
                            <a href="practice.html#sides" class="nav__link">Достопримечательности</a>
                        </li>
                        <li class="nav__item">
                            <a href="about.html" class="nav__link">Контакты</a>
                        </li>
                        <li class="nav__item">
                            <a href="practice.html#faq" class="nav__link">Вопросы</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
        <main class="main">
            <div class="container">

                <section class="contact" id="contact">
                    <h2>Контакты</h2>
                    <form class="forms" action="">
                        <fieldset class="forms__fieldset">
                            <legend>
                                <label for="name">Имя</label>
                            </legend>
                            <input type="text" id="name">
                        </fieldset>
                        <fieldset class="forms__fieldset">
                            <legend>
                                <label for="email">Электронная почта</label>
                            </legend>
                            <input type="email" name="email" id="">
                        </fieldset>
                        <fieldset class="forms__fieldset">
                            <legend>
                                <label for="text">Напишите нам</label>
                            </legend>
                            <textarea name="text" id="" rows="10"></textarea>
                        </fieldset>

                        <button class="btn" type="submit">Отправить</button>
                    </form>
                </section>

                <section class="map" id="map">
                    <h2><b>Карта</b></h2>
                    <iframe
                        src="https://yandex.ru/map-widget/v1/?um=constructor%3Ae9c40afa7684732a31fa95131c9bd7ad016a0d6bb98f8ff44234896127438cb5&amp;source=constructor"

            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>&#169; Все права защищены 2025</p>
            </div>
        </footer>
